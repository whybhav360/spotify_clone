name: spotify_clone
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg:
  flutter_bloc:
  hydrated_bloc:
  path_provider:
  firebase_core:
  firebase_auth:
  get_it:
  dartz:
  cloud_firestore:
  just_audio:
  flutter_native_splash:
  flutter_launcher_icons:
  youtube_player_flutter:
  flutter_inappwebview:


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
     - assets/fonts/
     - assets/images/
     - assets/vectors/


  fonts:
     - family: Satoshi
       fonts:
         - asset: assets/fonts/Satoshi-Black.ttf
           weight: 900
         - asset: assets/fonts/Satoshi-Bold.ttf
           weight: 600
         - asset: assets/fonts/Satoshi-Light.ttf
           weight: 500
         - asset: assets/fonts/Satoshi-Medium.ttf
           weight: 400
         - asset: assets/fonts/Satoshi-Regular.ttf
           weight: 300
      
